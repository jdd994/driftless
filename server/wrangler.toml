name = "driftless-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Fill database_id after: npx wrangler d1 create driftless
[[d1_databases]]
binding = "DB"
database_name = "driftless"
database_id = "93a4c55b-ce71-47fe-b86e-18402aa3913c"

[vars]
# The Pages origin allowed to call this API (CORS). Add a custom domain here too
# when you have one. TOKEN_SECRET is a *secret*, set separately:
#   npx wrangler secret put TOKEN_SECRET
ALLOWED_ORIGIN = "https://driftless-8nc.pages.dev"
